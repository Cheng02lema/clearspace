    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#112e29"/><stop offset="1" stop-color="#1b5145"/></linearGradient>
    <linearGradient id="arc" x1="0" x2="1"><stop stop-color="#a1d6bc"/><stop offset="1" stop-color="#e0f1dc"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <circle cx="1060" cy="190" r="210" fill="none" stroke="#80b9a2" stroke-opacity=".10"/>
